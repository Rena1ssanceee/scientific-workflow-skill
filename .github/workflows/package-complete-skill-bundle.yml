name: Package complete skill bundle

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: scientific-workflow-skill
      - name: Collect repositories and package
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/K-Dense-AI/scientific-agent-skills.git
          git clone --depth 1 https://github.com/Yuan1z0825/nature-skills.git
          mkdir -p bundle
          mv scientific-workflow-skill bundle/
          mv scientific-agent-skills bundle/
          mv nature-skills bundle/
          cat > bundle/CONTENTS.txt <<'TXT'
          Complete source bundle for the scientific-workflow skill pack.

          Included repositories:
          - Rena1ssanceee/scientific-workflow-skill
          - K-Dense-AI/scientific-agent-skills
          - Yuan1z0825/nature-skills

          The router's install.sh identifies the exact component skills used by the workflow.
          TXT
          tar -czf scientific-workflow-all-skills.tar.gz -C bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: scientific-workflow-all-skills
          path: scientific-workflow-all-skills.tar.gz
          if-no-files-found: error
