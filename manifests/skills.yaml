pack_name: scientific-workflow
display_name: Scientific Workflow
description: >
  A Codex skill pack for scientific brainstorming, literature review,
  statistical analysis, academic search, figure preparation, writing,
  polishing, reviewer-style evaluation, and evidence-driven research planning.

local_skills:
  - name: scientific-workflow
    role: >
      Main router for ordinary scientific tasks and comprehensive
      evidence-driven literature-survey-and-research-planning workflows.
    local_modules:
      - high-recall comprehensive literature-search protocol
      - full-text evidence extraction
      - project-specific data-situation audit
      - candidate-direction evaluation
      - v3-style report assembly
      - final scientific quality control

upstream_skills:
  - name: scientific-brainstorming
    role: Research ideas, hypotheses, innovation points, and study design after evidence and data constraints are established.
    source: K-Dense-AI/scientific-agent-skills

  - name: literature-review
    role: Literature review, evidence synthesis, and research gap analysis.
    source: K-Dense-AI/scientific-agent-skills

  - name: statistical-analysis
    role: Statistical analysis, data auditing, experimental design, model selection, and result interpretation.
    source: K-Dense-AI/scientific-agent-skills

  - name: nature-academic-search
    role: Academic search, DOI checking, bibliographic verification, and literature retrieval.
    source: Yuan1z0825/nature-skills

  - name: nature-figure
    role: Scientific figure planning, refinement, and Nature-style visual presentation.
    source: Yuan1z0825/nature-skills

  - name: nature-writing
    role: Manuscript and formal report writing, including abstract, introduction, results, discussion, and cover-letter style content.
    source: Yuan1z0825/nature-skills

  - name: nature-polishing
    role: Academic polishing, clarity improvement, tone control, and non-native English refinement.
    source: Yuan1z0825/nature-skills

  - name: nature-reviewer
    role: Reviewer-style evaluation, pre-submission critique, novelty assessment, and logic checking.
    source: Yuan1z0825/nature-skills
